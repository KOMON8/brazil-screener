name: 毎晩データ更新

on:
  schedule:
    - cron: "48 9 * * *"     # 毎日 18:48（日本時間）。ブラジル市場が開く 22:00 より前
  workflow_dispatch: {}      # Actions の画面から手動でも実行できる
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ライブラリを入れる
        run: pip install yfinance pandas numpy openpyxl xlrd
      - name: 財務データの記録を復元
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/fund_cache.json
            scripts/fund_cache_jp.json
            scripts/jp_list.json
          key: fund-${{ github.run_id }}
          restore-keys: fund-
      - name: データを作る（ブラジル株）
        run: python scripts/build_data.py
      - name: データを作る（日本株）
        continue-on-error: true      # 日本株で失敗しても、ブラジル株のページは公開する
        run: mkdir -p site/data && python -u scripts/build_jp.py 2>&1 | tee site/data/jp_log.txt
      - name: 財務データの記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/fund_cache.json
            scripts/fund_cache_jp.json
            scripts/jp_list.json
          key: fund-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
